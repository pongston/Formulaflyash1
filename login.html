<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Team B</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg,#1f2937,#111827);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Segoe UI',sans-serif;
}

.login-card{
    background:#1f2937;
    border-radius:20px;
    padding:40px;
    width:100%;
    max-width:400px;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    color:white;
}

.logo-box{
    width:80px;
    height:80px;
    background:black;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:40px;
    font-weight:bold;
    color:white;
}

.form-control{
    background:#374151;
    border:none;
    color:white;
}

.form-control:focus{
    background:#4b5563;
    color:white;
    box-shadow:none;
}

.btn-login{
    background:#facc15;
    border:none;
    font-weight:bold;
}

.btn-login:hover{
    background:#eab308;
}

.footer-text{
    font-size:13px;
    color:#9ca3af;
    text-align:center;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo-box mb-3">
        B
    </div>

    <h4 class="text-center mb-4">Bell Login Kub</h4>

    <form method="POST" action="/login">

        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button class="btn btn-login w-100 mt-2">Login</button>

    </form>

    <div class="footer-text">
        © Bell Korat na kub
    </div>

</div>

</body>
</html>
